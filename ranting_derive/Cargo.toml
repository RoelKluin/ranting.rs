[package]
name = "ranting_derive"
version = "0.2.1"
authors = ["Roel Kluin <Roel.Kluin@gmail.com>"]
description = "A proc-macro library for internal support of ranting"
license-file = "../LICENSE.txt"
edition = "2024"
repository = "https://github.com/RoelKluin/ranting.rs"
readme = "README.md"
documentation = "https://docs.rs/ranting_derive/0.2.1/ranting_derive/"

[dependencies]
darling = "0.20"
itertools = "0.10.3"
litrs = "0.2.3"
proc-macro2 = "1.0.49"
quote = "1.0.20"
ranting_core = { version = "0.1.0", path = "../ranting_core" }
regex = "1.11"
syn = { version = "2.0", features = ["full"] }
unicode-width = "0.1.5"

[dev-dependencies]
proptest = "1"

[lib]
proc-macro = true

### FEATURES #################################################################

[features]
default = []

## allows debugging.
debug = []
