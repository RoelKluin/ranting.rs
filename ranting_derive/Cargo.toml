[package]
name = "ranting_derive"
version = "2.1.0"
authors = ["Roel Kluin <Roel.Kluin@gmail.com>"]
description = "A proc-macro library for internal support of ranting"
license = "MIT"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/RoelKluin/ranting.rs"
readme = "README.md"
documentation = "https://docs.rs/ranting_derive/2.1.0/ranting_derive/"

[dependencies]
darling = "0.20"
itertools = "0.10.3"
litrs = "0.2.3"
proc-macro2 = "1.0.49"
quote = "1.0.20"
ranting_core = { version = "2.1.0", path = "../ranting_core", default-features = false }
regex = "1.11"
syn = { version = "2.0", features = ["full"] }
unicode-width = "0.1.5"

[dev-dependencies]
proptest = "1"

[lib]
proc-macro = true

### FEATURES #################################################################

[features]
default = []

## allows debugging.
debug = []

## enables heed!()/ask!()/#[derive(Heed)].
heed = ["ranting_core/heed"]
